<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6b4fbb">
  <title>آفلاین — نشانه</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <!-- این صفحه باید بدون اینترنت و بدون فایل بیرونی کار کند؛ پس استایل درون‌خطی است. -->
  <style>
    :root {
      --accent: #6b4fbb;
      --ink: #131419;
      --ink-2: #5b6070;
      --ink-3: #8d919d;
      --surface: #ffffff;
      --line: rgba(19, 20, 25, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Pinar FD", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 85% -10%, rgba(107, 79, 187, 0.18), transparent 55%),
        radial-gradient(90% 70% at 0% 110%, rgba(47, 143, 168, 0.14), transparent 60%),
        #eeedea;
      display: grid;
      place-items: center;
      padding: 28px;
      line-height: 1.9;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(19, 20, 25, 0.10);
    }
    .mark {
      width: 62px; height: 62px;
      margin: 0 auto 16px;
      border-radius: 20px;
      display: grid; place-items: center;
      color: #fff;
      font-size: 26px;
      background: linear-gradient(140deg, #7c5cd6, #45348a);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 18px; color: var(--ink-2); font-size: 13.5px; }
    .small { color: var(--ink-3); font-size: 11.5px; margin: 14px 0 0; }
    button {
      width: 100%;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      padding: 14px 18px;
      border-radius: 18px;
    }
    button:active { transform: scale(0.985); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <h1>فعلاً اینترنتی نیست</h1>
    <p>
      نشانه بدون اتصال باز نشد. اتصالت را چک کن و یک بار دیگر تلاش کن؛
      فال‌ها و نتیجه‌های ذخیره‌شده‌ات جایی نرفته‌اند.
    </p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
    <p class="small">نشانه — فال و خودشناسی (آفلاین)</p>
  </div>
</body>
</html>
