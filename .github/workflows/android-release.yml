# ساخت APK نشانه (PWA در پوستهٔ اندروید) و گذاشتنش در ریلیز همان نسخه.
#
# چرا اینجا و نه روی لپ‌تاپ: ساخت APK به Android SDK و Gradle نیاز دارد (چند صد
# مگابایت) و روی شبکه‌های فیلترشده دانلودش دردسر است. رانرهای گیت‌هاب هر دو را
# از قبل دارند، پس ساخت تکرارپذیر و ماشین‌محور می‌شود.
#
# پیش‌نیاز: فایل android/host.txt باید یک خط، آدرس https عمومی اپ باشد. اگر خالی
# باشد، این ورک‌فلو با یک اعلان رد می‌شود و هیچ APK خرابی منتشر نمی‌کند.
#
# امضا: اگر Secretهای زیر تنظیم شده باشند، APK با کلید دائمی امضا می‌شود؛
# در غیر این صورت با امضای دیباگ ساخته می‌شود تا خروجی همچنان نصب‌شدنی باشد.
#   ANDROID_KEYSTORE_BASE64    محتوای base64 فایل .p12/.jks
#   ANDROID_KEYSTORE_PASSWORD  رمز کی‌استور
#   ANDROID_KEY_ALIAS          نام کلید (پیش‌فرض: neshane)

name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/__init__.py"
      - "app/pwa.py"
      - "app/static/icons/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "آدرس https اپ (اختیاری؛ خالی = خواندن از android/host.txt)"
        required: false
        default: ""
      publish:
        description: "APK در ریلیز منتشر شود؟"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: آماده بودن آدرس اپ؟
        id: host
        env:
          INPUT_URL: ${{ inputs.app_url }}
        run: |
          url="$INPUT_URL"
          if [ -z "$url" ] && [ -s android/host.txt ]; then
            url=$(tr -d '\r\n' < android/host.txt)
          fi
          case "$url" in
            https://*)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "app_url=$url" >> "$GITHUB_OUTPUT"
              # گریدل همین فایل را می‌خواند؛ پس ورودی دستی هم اینجا می‌نشیند.
              printf '%s\n' "$url" > android/host.txt
              ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=APK ساخته نشد::آدرس https اپ تنظیم نشده است؛ android/host.txt را پر کن (یا ورک‌فلو را با ورودی app_url اجرا کن)."
              ;;
          esac

      - name: نسخهٔ اپ
        if: steps.host.outputs.ok == 'true'
        id: version
        run: |
          value=$(grep -oE '__version__[[:space:]]*=[[:space:]]*"[^"]+"' app/__init__.py | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          echo "value=${value:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Java 17
        if: steps.host.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        if: steps.host.outputs.ok == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Gradle
        if: steps.host.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: کلید امضا (اگر تنظیم شده باشد)
        if: steps.host.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/neshane-release.p12
            printf 'storeFile=neshane-release.p12\nalias=%s\npassword=%s\n' \
              "${KEY_ALIAS:-neshane}" "$KEYSTORE_PASSWORD" > android/keystore.properties
            echo "امضا: کلید دائمی پروژه"
          else
            echo "::warning title=امضای دیباگ::Secretهای کلید تنظیم نشده‌اند؛ APK با امضای دیباگ ساخته می‌شود."
            echo "امضا: دیباگ (موقت)"
          fi

      - name: ساخت APK
        if: steps.host.outputs.ok == 'true'
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: آماده‌سازی فایل نهایی
        if: steps.host.outputs.ok == 'true'
        id: artifact
        run: |
          mkdir -p dist
          source_apk=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$source_apk" ]; then
            echo "::error::فایل APK ساخته نشد."
            exit 1
          fi
          name="neshane-${{ steps.version.outputs.value }}-universal.apk"
          cp "$source_apk" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"

      - name: نگه‌داشتن APK به‌عنوان خروجی ورک‌فلو
        if: steps.host.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neshane-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: انتشار در ریلیز نسخه
        if: steps.host.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: نشانه ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: ${{ steps.artifact.outputs.path }}
          body: |
            ## نشانه — نسخهٔ ${{ steps.version.outputs.value }}

            این ریلیز شامل **فایل APK اندروید** است: همان PWA نشانه که داخل یک
            پوستهٔ نیتیو باز می‌شود (بدون نوار آدرس).

            | | |
            | --- | --- |
            | بستهٔ اندروید | `app.neshane` |
            | آدرس اپ | ${{ steps.host.outputs.app_url }} |
            | حداقل اندروید | ۵٫۰ (API 21) |
            | ساخته‌شده از | `${{ github.sha }}` |

            APK از همین مخزن و با همان کلید امضای پروژه ساخته می‌شود؛ برای همین
            نسخه‌های بعدی روی همین اپ نصب می‌شوند و لازم نیست کاربر اپ را پاک کند.

            > اگر روی گوشی می‌خواهی نصب کنی، اجازهٔ «نصب از منابع نامشخص» را برای
            > مرورگر یا فایل‌منیجر خودت روشن کن.
